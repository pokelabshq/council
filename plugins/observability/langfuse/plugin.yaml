name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Council — traces conversations, LLM calls, and tool usage. Opt-in via `council plugins enable observability/langfuse` (or check the box in `council plugins`)."
author: PokeLabs
requires_env:
  - COUNCIL_LANGFUSE_PUBLIC_KEY
  - COUNCIL_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
