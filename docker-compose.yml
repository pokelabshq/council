version: "3.9"

services:
  gateway:
    build: ./gateway
    ports:
      - "8700:8700"
    depends_on:
      - sentiment
      - link-preview
      - keyword-extractor
      - qr-generator
      - dns-lookup
      - color-palette
      - text-summary
      - url-shortener
      - password-generator
      - timestamp-converter
      - json-formatter
      - base64-tool
      - markdown-render
      - status-dashboard
      - hash-gen
      - uuid-gen
      - timestamp-conv
    restart: unless-stopped

  sentiment:
    build: ./poke-services/sentiment
    ports:
      - "8764:8764"
    restart: unless-stopped

  link-preview:
    build: ./poke-services/link-preview
    ports:
      - "8765:8765"
    restart: unless-stopped

  keyword-extractor:
    build: ./poke-services/keyword-extractor
    ports:
      - "8766:8766"
    restart: unless-stopped

  qr-generator:
    build: ./poke-services/qr-generator
    ports:
      - "8767:8767"
    restart: unless-stopped

  dns-lookup:
    build: ./poke-services/dns-lookup
    ports:
      - "8768:8768"
    restart: unless-stopped

  color-palette:
    build: ./poke-services/color-palette
    ports:
      - "8769:8769"
    restart: unless-stopped

  text-summary:
    build: ./poke-services/text-summary
    ports:
      - "8770:8770"
    restart: unless-stopped

  url-shortener:
    build: ./poke-services/url-shortener
    ports:
      - "8771:8771"
    restart: unless-stopped

  password-generator:
    build: ./poke-services/password-generator
    ports:
      - "8772:8772"
    restart: unless-stopped

  timestamp-converter:
    build: ./poke-services/timestamp-converter
