version: '3.8'

services:
  poke-dashboard:
    build: .
    ports:
      - "8799:8799"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8799/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  link-preview:
    build: .
    ports:
      - "8765:8765"
    environment:
      - PORT=8765
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  poke-bot:
    build: .
    ports:
      - "8770:8770"
    environment:
      - PORT=8770
      - GITHUB_SECRET=${GITHUB_SECRET}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    restart: unless-stopped

  webhook-relay:
    build: .
    ports:
      - "8775:8775"
    environment:
      - PORT=8775
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    restart: unless-stopped
