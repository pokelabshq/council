<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poke Labs — Status Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 2rem; text-align: center; border-bottom: 1px solid #2a2a4a; }
.header h1 { font-size: 2rem; background: linear-gradient(90deg, #00d4ff, #7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header p { color: #888; margin-top: .5rem; }
.container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
.repo { background: #141428; border: 1px solid #2a2a4a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
.repo h2 { color: #00d4ff; margin-bottom: .5rem; }
.repo h2 a { color: inherit; text-decoration: none; }
.repo h2 a:hover { text-decoration: underline; }
.repo-meta { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.badge { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 20px; padding: .25rem .75rem; font-size: .85rem; }
.badge.green { border-color: #22c55e; color: #22c55e; }
.badge.red { border-color: #ef4444; color: #ef4444; }
.badge.yellow { border-color: #eab308; color: #eab308; }
.badge.blue { border-color: #3b82f6; color: #3b82f6; }
.issues { margin-top: 1rem; }
.issues h3 { color: #888; font-size: .9rem; margin-bottom: .5rem; }
.issue { background: #0a0a0f; border-radius: 8px; padding: .75rem; margin-bottom: .5rem; border-left: 3px solid #7b2ff7; }
.issue a { color: #e0e0e0; text-decoration: none; }
.issue a:hover { color: #00d4ff; }
.services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
.service { background: #0a0a0f; border-radius: 8px; padding: 1rem; text-align: center; }
.service .name { color: #00d4ff; font-weight: bold; }
.service .status { font-size: .85rem; margin-top: .25rem; }
.footer { text-align: center; padding: 2rem; color: #555; font-size: .85rem; }
</style>
</head>
<body>
<div class="header">
<h1>🦉 Poke Labs</h1>
<p>Open Source Micro-Services — Status Dashboard</p>
</div>
<div class="container">

<div class="repo" id="council-repo">
<h2><a href="https://github.com/pokelabshq/council" target="_blank">pokelabshq/council</a></h2>
<div class="repo-meta"><span class="badge">Loading...</span></div>
<div class="issues" id="council-issues"></div>
<div class="services-grid" id="council-services"></div>
</div>

<div class="repo" id="poke-repo">
<h2><a href="https://github.com/pokelabshq/poke" target="_blank">pokelabshq/poke</a></h2>
<div class="repo-meta"><span class="badge">Loading...</span></div>
<div class="issues" id="poke-issues"></div>
</div>

<div class="footer">Poke Labs — MIT License — Built by Poke for Alexander Wondwossen<br><span id="last-update"></span></div>
</div>

<script>
const API = 'https://api.github.com';

async function fetchRepo(name) {
  try {
    const r = await fetch(`${API}/repos/${name}`);
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch(e) { return null; }
}

async function fetchIssues(name) {
  try {
    const r = await fetch(`${API}/repos/${name}/issues?state=open&per_page=10`);
    if (!r.ok) throw new Error(r.status);
    return (await r.json()).filter(i => !i.pull_request);
  } catch(e) { return []; }
}

async function fetchBranches(name) {
  try {
    const r = await fetch(`${API}/repos/${name}/branches?per_page=100`);
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch(e) { return []; }
}

function renderRepo(id, data, issues, branches) {
  const meta = document.getElementById(`${id}-meta`);
  const issuesEl = document.getElementById(`${id}-issues`);
  
  if (!data) {
    if (meta) meta.innerHTML = '<span class="badge red">API Error</span>';
    return;
  }
  
  if (meta) {
    meta.innerHTML = `
      <span class="badge blue">⭐ ${data.stargazers_count}</span>
      <span class="badge ${data.open_issues_count ? 'yellow' : 'green'}">📋 ${data.open_issues_count} issues</span>
      <span class="badge">${data.language || 'Mixed'}</span>
      <span class="badge">${branches.length} branches</span>
      <span class="badge green">🕐 Updated: ${new Date(data.updated_at).toLocaleDateString()}</span>
    `;
  }
  
  if (issuesEl) {
    if (issues.length === 0) {
      issuesEl.innerHTML = '<h3>Open Issues</h3><p style="color:#555">No open issues ✅</p>';
    } else {
      issuesEl.innerHTML = '<h3>Open Issues</h3>' + issues.map(i =>
        `<div class="issue"><a href="${i.html_url}" target="_blank">#${i.number} ${i.title}</a> ${i.labels.map(l=>`<span class="badge blue">${l.name}</span>`).join(' ')}</div>`
      ).join('');
    }
  }
}

async function load() {
  const [council, poke, councilIssues, pokeIssues, councilBranches] = await Promise.all([
    fetchRepo('pokelabshq/council'),
    fetchRepo('pokelabshq/poke'),
    fetchIssues('pokelabshq/council'),
    fetchIssues('pokelabshq/poke'),
    fetchBranches('pokelabshq/council'),
  ]);
  
  renderRepo('council', council, councilIssues, councilBranches);
  
  const pokeMeta = document.getElementById('poke-repo').querySelector('.repo-meta');
  const pokeIssuesEl = document.getElementById('poke-issues');
  renderRepo('poke', poke, pokeIssues, []);
  
  // Render services from council branches
  const servicesEl = document.getElementById('council-services');
  if (servicesEl && councilBranches) {
    const serviceBranches = councilBranches.filter(b => !['main','master','gh-pages'].includes(b.name) && !b.name.startsWith('dependabot'));
    if (serviceBranches.length) {
      servicesEl.innerHTML = '<h3 style="width:100%;color:#888;font-size:.9rem;margin-bottom:.5rem;">Custom Branches</h3>' +
        serviceBranches.map(b => `<a href="https://github.com/pokelabshq/council/tree/${b.name}" target="_blank" style="color:#7b2ff7;text-decoration:none;"><span class="badge">${b.name}</span></a>`).join(' ');
    }
  }
  
  document.getElementById('last-update').textContent = `Last updated: ${new Date().toLocaleString()}`;
}

load();
</script>
</body>
</html>
