name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv pip install -e .[dev]

      - name: Run Python tests
        run: python -m pytest tests/ -x -q --timeout=30

  service-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d
          # Wait for services to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8765/api/health >/dev/null 2>&1; then
              echo "Services are up"
              break
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done

      - name: Check all service health endpoints
        run: |
          SERVICES="8765 8766 8767 8768 8769 8770 8771 8772 8773 8774 8775 8776 8777 8778 8779 8780 8781 8782 8790 8791"
          FAILED=0
          for port in $SERVICES; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${port}/api/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "  ✅ port $port — healthy"
            else
              echo "  ❌ port $port — HTTP $HTTP_CODE"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "One or more services failed health check"
            exit 1
          fi
          echo ""
          echo "All services healthy ✅"

      - name: Stop services
        if: always()
        run: docker compose down
