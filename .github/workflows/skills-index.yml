name: Build Skills Index

on:
  schedule:
    # Run twice daily: 6 AM and 6 PM UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - 'scripts/build_skills_index.py'
      - '.github/workflows/skills-index.yml'

permissions:
  contents: write  # changed from read to write — needed to commit the index
  actions: write   # to trigger deploy-site.yml on schedule

jobs:
  build-index:
    # Only run on the upstream repository, not on forks
    if: github.repository == 'pokelabshq/council'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx==0.28.1 pyyaml==6.0.2

      - name: Build skills index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_skills_index.py

      - name: Commit skills index to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/static/api/skills-index.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update skills-index.json [skip ci]"
            git push
          fi

  # Re-trigger the docs deploy so the refreshed index lands on the live site.
  trigger-deploy:
    needs: build-index
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Site workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-site.yml --repo ${{ github.repository }}
