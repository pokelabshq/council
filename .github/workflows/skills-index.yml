name: Build Skills Index

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_skills_index.py'
      - 'skills/**'
      - 'optional-skills/**'
      - 'tools/skills_hub.py'
      - '.github/workflows/skills-index.yml'

permissions:
  contents: read
  actions: write

jobs:
  build-index:
    if: github.repository == 'pokelabshq/council'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx==0.28.1 pyyaml==6.0.2

      - name: Build skills index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_skills_index.py

      - name: Upload index artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: skills-index
          path: website/static/api/skills-index.json
          retention-days: 7

      - name: Commit index to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/static/api/skills-index.json
          git diff --cached --quiet || git commit -m "chore: update skills-index.json [skip ci]"
          git push

  trigger-deploy:
    needs: build-index
    # Trigger deploy on schedule, push (skill changes), AND manual dispatch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Site workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-site.yml --repo ${{ github.repository }}
